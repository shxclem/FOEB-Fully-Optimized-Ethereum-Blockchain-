<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sharding DApp</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>

  <body>

    <div class="container">
      <h1>Blob messaging prototype</h1>

      <!-- Text box with info about the connected account -->
      <label for="accountInfo">Connected account address:</label>
      <input
        id="accountInfo"
        type="text"
        readonly
        placeholder="Connect MetaMask to see your address"
      />
      <label for="privateKeyInput">Private key. <span class="important"></span>Important: hexadecimal format, starting with 0x</span></label>
      <input 
        id="privateKeyInput"
        type="text"
        placeholder="Private key (needed to send blobs)"
      />
 
      <div class="tabs">
        <button id="tabSend" class="tab active">Send</button>
        <button id="tabReceive" class="tab">Receive</button>
      </div>
      <div id="viewSend" class="tabview active">
        <!-- Your current sending form goes here -->
        <h1>Sending</h1>

        <!-- Input for the address -->
        <label for="receiver">Enter the receiver's address:</label>
        <input id="receiver" type="text" placeholder="Enter an address" />

        <!-- Input for the blob content -->
        <label for="blobContent">Blob content:</label>
        <textarea
          id="blobContent"
          placeholder="Write the blob content"
        ></textarea>

        <!-- Checkbox to encrypt the message -->
        <div class="checkbox-container">
          <label for="encryptMessage">Encrypt the message? <br><br>
            Note: requires the recipient to have sent a message previously</label>
            <br>
          <input id="encryptMessage" type="checkbox" />
        </div>
        <br>
        <!-- Send button -->
        <button id="sendBlob">Send Message</button>

        <!-- Button to connect to MetaMask -->
        <button id="connectMetamask">Connect Metamask</button>
      </div>
      <div id="viewReceive" class="tabview">
        <!-- The new receiving view goes here -->
        <h2>Receiving blobs</h2>
        Receiver address (optional):
        <input id="receiverFilter" placeholder="Filter by receiver address" />
        Sender address (optional):
        <input id="senderFilter" placeholder="Filter by sender address" />
        <button id="viewEvents">View all messages</button>
        <button id="searchEvents">Filter messages</button>

        <div id="receivedBlobs"></div>
      </div>
    </div>

    <script src="./src/app.js" type="module"></script>

    <script type="module">
      import { loadKZG } from 'kzg-wasm'
    </script>
  </body>
</html>
